<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <!-- Retro Pixel Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">

        <!-- Top bar with Again button and range -->
        <div class="top-bar">
            <button id="againButton" class="retro-btn">Again!</button>
            <p class="description">&lt;Between <strong>1 and 100</strong>&gt;</p>
        </div>

        <h1>Guess My Number!</h1>

        <!-- Middle divider with secret number box -->
        <div class="center-divider">
            <div class="secret-box" id="secretBox">?</div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen">
            <div class="main-content">
                <!-- Left column: Input & Submit -->
                <div class="input-section">
                    <input
                        type="number"
                        id="guessInput"
                        placeholder="0"
                        min="1"
                        max="100"
                    >
                    <button id="submitButton" class="retro-btn">Check!</button>
                </div>

                <!-- Right column: Feedback, Attempts, Previous -->
                <div class="stats-section">
                    <p id="feedback">Start guessing!</p>

                    <div class="attempt-box">
                        <p>💥 Attempts: <span id="attemptsDisplay">0</span></p>
                    </div>

                    <div class="previous-section">
                        <h3>Previous Guesses:</h3>
                        <div id="previousGuesses">no guesses yet</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden">
            <h2>🎉 Correct Number!</h2>
            <p id="gameOverMessage"></p>
            <button id="resetButton" class="retro-btn">Start New Game</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
