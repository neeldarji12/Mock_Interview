<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moct Interview</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">

        <h1>Number Guessing Game</h1>

         <p class="description">
            Guess a number between <strong>1 and 100</strong>
        </p>

        <!---game screen---->

        <div id="gameScreen">

            <div class="input-section">

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter your guess"
                    min="1"
                    max="100"
                >

                <button id="submitButton">
                    Submit Guess
                </button>

            </div>

            <!-- Feedback -->
            <p id="feedback">
                Start guessing!
            </p>

            <!-- Attempts -->
            <div class="attempt-box">
                <p>Attempts</p>
                <span id="attemptsDisplay">0</span>
            </div>

            <!-- Previous Guesses -->
            <div class="previous-section">

                <h3>Previous Guesses</h3>

                <div id="previousGuesses">
                    No guesses yet
                </div>

            </div>

        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden">

            <h2> Congratulations!</h2>

            <p id="gameOverMessage"></p>

            <button id="resetButton">
                Start New Game
            </button>

        </div>

    </div>

     <script src="script.js"></script>
     
</body>
</html>
